name: Build image and deploy to Dokku

# Start manually while this pipeline is being introduced. A build never deploys
# unless the caller opts in AND the repository enable flag has been set.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built image to packages on fsn1
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: packages-image-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/survos-sites/packages

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the fsn1 image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          target: prod
          pull: true
          push: true
          tags: ghcr.io/survos-sites/packages:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/survos-sites/packages
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=packages-amd64
          cache-to: type=gha,scope=packages-amd64,mode=max

      - name: Smoke-test the published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="$IMAGE@$DIGEST"
          docker pull "$image"
          docker run --rm --entrypoint sh "$image" -ec '
            test -f /app/Procfile
            test -f /app/app.json
            test -f /app/vendor/autoload_runtime.php
            test -d /app/public/assets
            test -d /app/public/bundles
            php -r '\''$a=json_decode(file_get_contents("/app/app.json"),true,512,JSON_THROW_ON_ERROR); if (empty($a["scripts"]["dokku"]["predeploy"])) exit(1);'\''
            frankenphp version
            frankenphp validate --config /etc/caddy/Caddyfile
          '
          # Exercise Caddy/static routing without production credentials or data.
          docker run -d --name packages-smoke -p 127.0.0.1:8080:80 "$image"
          trap 'docker logs packages-smoke; docker rm -f packages-smoke >/dev/null' EXIT
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 2 --max-time 10 http://127.0.0.1:8080/favicon.ico >/dev/null

      - name: Record the release artifact
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### Packages image\n\nCommit: `%s`\n\nImage: `%s@%s`\n\nImage smoke checks passed. Production application checks run only in the deployment job.\n' \
            "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: ${{ inputs.deploy && github.ref == 'refs/heads/main' && vars.PACKAGES_DOKKU_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure deployment SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DOKKU_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host fsn1
            HostName fsn1.survos.com
            User dokku
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF

      - name: Deploy the exact tested image
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          ssh fsn1 apps:exists packages
          ssh fsn1 git:from-image packages "$IMAGE@$DIGEST"

      - name: Verify the running release
        run: |
          set -euo pipefail
          ssh fsn1 ps:report packages
          ssh fsn1 run packages php bin/console doctrine:schema:validate --no-interaction
          curl --fail --silent --show-error --retry 6 --retry-all-errors \
            --retry-delay 5 --max-time 20 https://packages.survos.com/health >/dev/null

      - name: Remove deployment credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
