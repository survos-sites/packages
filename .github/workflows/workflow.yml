name: install-and-phpunit

on:
  [push, pull_request]

jobs:
#  coding-style:
#    runs-on: ubuntu-latest
#    steps:
#      - uses: actions/checkout@v4
#      - uses: shivammathur/setup-php@v2
#        with:
#          php-version: '8.2'
#          coverage: none
#      - name: php-cs-fixer
#        run: |
#          wget https://github.com/FriendsOfPHP/PHP-CS-Fixer/releases/download/v3.13.2/php-cs-fixer.phar -q
#          php php-cs-fixer.phar fix --dry-run --diff

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/packages?serverVersion=18&charset=utf8
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: packages
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        php-version:
          - '8.5'
#        include:
#          - php-version: '8.3'
#            symfony-version: '6.4.*'
#          - php-version: '8.3'
#            symfony-version: '7.1.*'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP with pcov
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: ${{ matrix.php-version }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Prepare the isolated test database
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:schema:create --env=test

      - name: Run PHPUnit
        run: vendor/bin/phpunit
