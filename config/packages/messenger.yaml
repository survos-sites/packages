framework:
    messenger:
        failure_transport: failed

        transports:
            bundle.load:
                options:
                    prefetch_count: 16
                    delay:
                        durable: true
            elastic:
                dsn: '%env(MESSENGER_TRANSPORT_DSN_RABBITMQ)%'
                options:
                    prefetch_count: 50
                    exchange:
                        name: packages.elastic
                    queues:
                        packages.elastic: ~
                    delay:
                        durable: true
                retry_strategy:
                    max_retries: 3
                    multiplier: 2

            failed: 'doctrine://default?queue_name=failed&auto_setup=true'
            sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default:
                middleware:
                    - logging
                    - App\Messenger\PackageTransitionLockMiddleware

        routing:
#            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
#            Symfony\Component\Notifier\Message\ChatMessage: async
#            Symfony\Component\Notifier\Message\SmsMessage: async
#            App\Message\FetchComposer: async
            Survos\ElasticBundle\Message\ReindexDocuments: elastic
            Survos\ElasticBundle\Message\RemoveDocuments: elastic

            #            App\Message\ProcessPackage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
