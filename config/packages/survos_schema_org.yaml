survos_schema_org:
    # The package detail template extends @EasyAdmin/layout.html.twig, which we don't
    # own and can't add {{ render_schema_org() }} to. Injecting before </head> covers
    # every layout in the app; templates that DO call render_schema_org() (base.html.twig,
    # and so the listing pages) suppress the injection, so nothing renders twice.
    auto_inject: true

    # On in prod too, unlike the %kernel.debug% default. This app is the public
    # reference example for the bundle, so the JSON-LD is meant to be read in
    # view-source by people learning the mapping. The cost is bytes before
    # compression, and Cloudflare compresses this response anyway.
    pretty_print: true
