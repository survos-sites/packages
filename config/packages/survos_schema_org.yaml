survos_schema_org:
    # Cover layouts without an explicit render_schema_org() call.
    auto_inject: true

    # On in prod too, unlike the %kernel.debug% default. This app is the public
    # reference example for the bundle, so the JSON-LD is meant to be read in
    # view-source by people learning the mapping. The cost is bytes before
    # compression, and Cloudflare compresses this response anyway.
    pretty_print: true
