# config/packages/survos_crawler.yaml
survos_crawler:
# if you've run symfony proxy:domain:attach my-project, then the error messages will be displayed with this prefix.  That way, you can simply click on a link to open the page.
    base_url: 'https://packages.wip/'
    users: []
    max_depth : 3
    routes_to_ignore :
        - 'app_logout'
        # needs symfony/scheduler, which this app doesn't use
        - 'zenstruck_messenger_monitor_schedule'
    paths_to_ignore:
        - '^/_profiler'
        # EasyAdmin autocomplete endpoints need originatingPage/propertyName from a form
        - '^/admin/[a-z_]+/autocomplete$'
