survos_search:
    # An env var is fine here: the adapter is resolved at RUNTIME by AdapterProvider, not read
    # at compile time to pick a code branch. (It used to be the latter, and an %env() here
    # silently produced a null DSN and fell back to Doctrine -- see survos/mono#41.)
    default_adapter: '%env(SEARCH_ADAPTER)%'
    adapters:
        # Elasticsearch. Handles Package's multi-valued facets (symfonyVersions,
        # phpVersions) natively -- it buckets each array element.
        es: '%env(ELASTICSEARCH_DSN)%'

        # Postgres BM25, over the same tables Doctrine already owns.
        #
        # NOTE: flipping SEARCH_ADAPTER to `pg` currently throws, on purpose.
        # Package::FILTERABLE_FIELDS names json columns, and a DBAL adapter would
        # GROUP BY the whole serialized array -- rendering ["8.2","8.3"] as a single
        # bucket. AutoEntitySearch::configureDbalAdapter() refuses rather than produce
        # facets that look plausible and are wrong. To compare backends, drop the
        # array columns from FILTERABLE_FIELDS first.
        pg: 'postgres-bm25://default'
