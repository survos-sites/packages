survos_state:
    base_layout: base.html.twig
    enable_dynamic_routing: true
    workflow_paths:
        - '%kernel.project_dir%/src/Workflow'

    # One RabbitMQ queue per async workflow transition. Use Symfony's native AMQP
    # transport for 8.2 prefetch and parallel child-process support.
    queue_driver: rabbitmq
    async_transport_dsn: '%env(MESSENGER_TRANSPORT_DSN_RABBITMQ)%'
