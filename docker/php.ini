; Runtime overrides for the FrankenPHP image. FrankenPHP embeds PHP directly
; (not php-fpm/php-cgi), so the old buildpack-era .user.ini isn't guaranteed
; to be picked up the same way -- these go in conf.d instead.
memory_limit=256M
upload_max_filesize=512M
post_max_size=512M
max_execution_time=60
